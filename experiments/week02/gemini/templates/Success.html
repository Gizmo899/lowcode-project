<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; max-width: 600px; }
        .success { color: #28a745; }
        a { color: #007BFF; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>Thank You, {{ name }}!</h1>
    <p class="success">Your message has been successfully received. We will get back to you shortly.</p>
    <p><a href="{{ url_for('contact') }}">&larr; Send another message</a></p>
</body>
</html>
