{% extends 'base.html' %}
{% block title %}{{ heading }} — Pathway{% endblock %}
{% block content %}
<section class="page-heading"><div class="eyebrow">YOUR JOB SEARCH</div><h1>{{ heading }}</h1><p class="page-lede">Capture the details so you can keep track of every next step.</p></section>
<section class="form-card application-form-card"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><div class="form-field full-field"><label for="employer_name">Employer / company name</label><input id="employer_name" name="employer_name" required maxlength="160" value="{{ values.employer_name }}" placeholder="e.g. Northstar Studio"></div><div class="form-field full-field"><label for="job_title">Job title</label><input id="job_title" name="job_title" required maxlength="160" value="{{ values.job_title }}" placeholder="e.g. Junior Designer"></div><div class="form-field"><label for="date_applied">Date applied</label><input id="date_applied" name="date_applied" type="date" required value="{{ values.date_applied }}"></div><div class="form-field"><label for="status">Application status</label><select id="status" name="status" required>{% for status in statuses %}<option value="{{ status }}" {% if values.status == status %}selected{% endif %}>{{ status }}</option>{% endfor %}</select></div><div class="form-field full-field"><label for="job_url">Job advert URL</label><input id="job_url" name="job_url" type="url" required maxlength="2048" value="{{ values.job_url }}" placeholder="https://example.com/jobs/role"><small class="field-help">Enter the full web address beginning with https:// or http://.</small></div></div><div class="form-actions"><a class="button button-ghost" href="{{ url_for('applications.listing') }}">Cancel</a><button class="button button-primary" type="submit">Save application <span>→</span></button></div></form></section>
{% endblock %}
